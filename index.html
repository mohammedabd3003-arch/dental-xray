const idb = () => new Promise((res, rej) => {

      const tx = d.transaction('k', 'readwrite');
      tx.objectStore('k').put(v, k);
      tx.oncomplete = () => res(1);
      tx.onerror = tx.onabort = () => rej(tx.error || new Error('abort'));

};
const idbGet = async k => {

};

const SCF = /^(c[12](e[12]|q[1-3])|t1|t2|mid|fp|ft|note|prac|exam|act)$/;
function rowsOf(s) {
  const m = new Map(), put = (t, k, row) => m.set(t + '|' + k, { t, row });
  if (!s) return m;
  put('app_settings', 'main', { id: 'main', cfg: s.cfg });

  (s.imgs || []).forEach(i => put('xray_records', i.id, { id: i.id, annotations: i.ann || [], cal: i.cal == null ? null : i.cal }));

async function all(t) {
  const q = f => { let x = sb.from(t).select('*', f === 0 ? { count: 'exact' } : undefined); (ORD[t] || []).forEach(c => { x = x.order(c); }); return x.range(f, f + 999); };
  const first = await q(0); if (first.error) throw first.error;
  let o = first.data || [];
  if (first.count == null) { for (let f = 1000; o.length === f; f += 1000) { const r = await q(f); if (r.error) throw r.error; o = o.concat(r.data || []); } return o; }
  const pages = []; for (let f = 1000; f < first.count; f += 1000) pages.push(f);
  for (let i = 0; i < pages.length; i += 6) { const rs = await Promise.all(pages.slice(i, i + 6).map(q)); for (const r of rs) { if (r.error) throw r.error; o = o.concat(r.data || []); } }
  return o;
}

// نقطة استرجاع محلية كل 5 دقائق كحد أدنى، نحتفظ بآخر 5
function snap(d) {
  const now = Date.now();
  if (now - (snap.last || 0) < 300000) return;
  snap.last = now;
  const os = d.transaction('k', 'readwrite').objectStore('k');
  os.get('bk').onsuccess = e => {
    const a = e.target.result || [];
    a.unshift({ t: now, d: JSON.stringify(S) });
    os.put(a.slice(0, 5), 'bk');
  };
}

// يرجع: true نجح، false لا يوجد اتصال (محفوظ محلياً)، null رفضه الخادم (أُعيدت بيانات الخادم)
async function syncUp() {
  if (!sb || !me) return false;
  if (syncing) { again = true; return true; }
  syncing = true;
  clearTimeout(syncTimer);
  try {
    await lSave();
    if (!pending()) { setSt('☁ متزامن ' + nowT()); return true; }
    setSt('⏳ جارٍ الحفظ على الخادم...');
    const conf = await push();
    if (conf && conf.length) {
      try { await pull(); } catch (_) {}
      await lSave(); softRender();
      setSt('⚠ تعارض في ' + conf.length + ' قيمة — راجع النافذة', 'e');
      showConflicts(conf);
      return true;
    }
    await lSave();
    setSt('☁ متزامن ' + nowT());
    return true;
  } catch (err) {
    console.error(err);
    if (rejected(err)) {
      toast('⛔ رفض الخادم التعديل: ' + errMsg(err) + ' — أُعيدت البيانات كما هي على الخادم');
      setSt('⛔ رُفض تعديل: ' + errMsg(err), 'e');
      try { await pull(); await lSave(); } catch (_) {}
      softRender();
      return null;
    }
    setSt('⚠ لا يوجد اتصال — التعديلات محفوظة على هذا الجهاز وستُرفع تلقائياً', 'e');
    return false;
  } finally {
    syncing = false;
    if (again) { again = false; syncUp().catch(() => 0); }
  }
}

    r.push(['تطبيق مخطط قاعدة البيانات ' + APP_VER + ' (schema.sql)', !v.error && v.data === APP_VER, v.error ? 'لم يُطبَّق الملف بعد' : 'الإصدار ' + v.data]);
    const anon = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'dl-anon-check' } });
    const leak = [];
    for (const t of ['students', 'scores', 'attendance', 'staff_profiles', 'audit_log']) { const q = await anon.from(t).select('*').limit(1); if (!q.error && q.data && q.data.length) leak.push(t); }
    r.push(['منع غير المسجلين من قراءة البيانات', !leak.length, leak.length ? 'مكشوف: ' + leak.join('، ') : 'كل الجداول مرفوضة لغير المسجلين']);
    const l = await sb.from('lab_state').select('id').limit(1);
    r.push(['إغلاق الجدول القديم lab_state (السجل الواحد)', !!l.error || !(l.data || []).length, l.error ? 'مغلق أمام المستخدمين' : (l.data || []).length ? 'ما زال مقروءاً — نفّذ schema.sql' : 'لا يحتوي بيانات مقروءة']);
    const a = await sb.from('audit_log').select('id', { count: 'exact', head: true });
    r.push(['سجل التدقيق على الخادم', !a.error, a.error ? errMsg(a.error) : (a.count || 0) + ' عملية مسجلة']);
    try { const mf = await sb.auth.mfa.listFactors(); r.push(['التحقق الثنائي لحسابك (المدير)', !mf.error && ((mf.data && mf.data.totp) || []).some(x => x.status === 'verified'), mf.error ? 'غير متاح: فعّل TOTP في Supabase' : (((mf.data && mf.data.totp) || []).some(x => x.status === 'verified') ? 'مفعّل' : 'غير مفعّل — فعّله من الإعدادات')]); } catch (e) {}
    const p = await sb.from('staff_profiles').select('role,active');
    if (!p.error) {
      const ad = p.data.filter(x => x.active && x.role == 'admin').length, pe = p.data.filter(x => !x.active).length;
      r.push(['عدد حسابات المدير', ad >= 1 && ad <= 3, ad + ' مدير مفعّل' + (ad > 3 ? ' — يُفضّل ألا يتجاوز 3' : '')]);
      r.push(['حسابات بانتظار التفعيل', pe === 0 ? true : null, pe + ' حساب']);
    }
    if (S.imgs.length && S.imgs[0].path) {
      const u = sb.storage.from('xray-images').getPublicUrl(S.imgs[0].path).data.publicUrl;
      let pub = false; try { pub = (await fetch(u, { method: 'HEAD' })).ok; } catch (e) {}
      r.push(['خصوصية مخزن صور الأشعة', !pub, pub ? 'المخزن عام! يجب جعله خاصاً' : 'الرابط العام مرفوض — المخزن خاص']);
    } else r.push(['خصوصية مخزن صور الأشعة', null, 'لا توجد صور لاختبارها بعد']);
    r.push(['فتح النظام عبر رابط آمن (HTTPS)', location.protocol === 'https:' ? true : null, location.protocol === 'https:' ? location.host : 'يُفتح كملف محلي — يُنصح بنشره على رابط https رسمي']);
  } catch (e) { r.push(['تعذر إكمال الفحص', false, e.message || String(e)]); }
  chk = r;
  if (view === 'security') render();
}

<div class=box><h3>3. بنية الحماية</h3><ul>
<li>كل نوع بيانات في جدول مستقل (الكروبات، الطلبة، الجلسات، الحضور، الدرجات، صور الأشعة) بدل السجل الواحد السابق.</li>
<li>الخادم يفرض الحد الأعلى لكل درجة (نظري الكورس 7.5، نصف السنة 15، النهائي العملي 25، النهائي النظري 35) ويمنع مساعد المختبر من الكوزات والدرجات النظرية والنهائية.</li>
<li>كل إضافة أو تعديل أو حذف يُسجَّل تلقائياً على الخادم (اسم المستخدم، الوقت، القيمة السابقة والجديدة) ولا يملك أي مستخدم — ولا المدير — صلاحية تعديل السجل أو حذفه من البرنامج.</li>
<li>الحسابات الجديدة تُنشأ معطّلة ولا ترى أي بيانات حتى يفعّلها المدير ويحدد دورها وكروباتها.</li>
<li>مخزن صور الأشعة خاص، وروابط العرض موقّعة ومؤقتة (ساعة واحدة).</li>
<li>إغلاق تلقائي للجلسة بعد ${IDLE_MIN} دقيقة من عدم النشاط، ومسح البيانات المحلية من الجهاز عند الخروج.</li>
<li>التعديلات أثناء انقطاع الإنترنت تُحفظ على الجهاز وتُرفع تلقائياً عند عودة الاتصال، والتعديل المتزامن من زميلين يُدمج على مستوى الخلية الواحدة.</li>
<li>الدرجات والحضور تُحفظ بمعاملة واحدة على الخادم مع كشف التعارض: إذا عدّل زميلان نفس الخلية لا يُكتب فوق تعديل الأول، ويُخيَّر الثاني بين قيمته وقيمة الخادم.</li>
<li>حساب المدير الذي فعّل التحقق الثنائي لا يملك صلاحيات المدير على الخادم إلا بعد إدخال الرمز (aal2).</li>
<li>مفتاح الاتصال في الملف من نوع publishable (عام بطبيعته)؛ لا يوجد أي مفتاح سري داخل الملف.</li></ul></div>
<div class=box><h3>4. اختبارات يدوية قبل الاعتماد</h3><ul>
<li>أنشئ أربعة حسابات تجريبية: مدير، مدرس مسند لكروب A، مساعد مختبر مسند لكروب A، قراءة فقط — وتحقق من المصفوفة أعلاه بكل حساب.</li>
<li>بحساب المدرس: تأكد أنه لا يرى كروب B إطلاقاً.</li>
<li>بحساب مساعد المختبر: حاول تعديل درجة الاختبار — يجب أن يرفضها الخادم.</li>
<li>أدخل 150 كدرجة — يجب أن تُرفض.</li>
<li>افتح النظام على جهازين وعدّل من أحدهما — يجب أن يظهر التعديل في الآخر خلال ثوانٍ.</li>
<li>افصل الإنترنت وأدخل درجات ثم أعد الاتصال — يجب أن تُرفع تلقائياً.</li>
<li>خذ نسخة احتياطية واختبر استعادتها في مشروع Supabase تجريبي.</li>

const IMGT=[['PA','Periapical (حول ذروية)'],['BW','Bitewing (جناحية)'],['PAN','Panoramic (بانورامية)'],['CBCT','CBCT (مقطعية)']];

function shrinkBlob(f){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('فشل قراءة الملف'));
    reader.onload = e => {
      const im = new Image();
      im.onerror = () => rej(new Error('فشل معالجة الصورة'));
      im.onload = () => {
        const maxDim = 1600; // دقة أعلى للأشعة (كانت 1000)
        let w = im.width, h = im.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(im, 0, 0, w, h);
        canvas.toBlob(blob => blob ? res(blob) : rej(new Error('فشل ضغط الصورة')), 'image/jpeg', 0.85);
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

const idbDel = async k => { try { const d = await idb(); d.transaction('k', 'readwrite').objectStore('k').delete(k); } catch (e) {} };

// يرجع true فقط إذا نجح الرفع السحابي (سابقاً كان الفشل يُتجاهل فتبقى الصورة على جهاز واحد)
async function imgPut(id, blob, path){
  let cloudOk = false;
  if (sb && blob) {
    try {
      const { error } = await sb.storage.from('xray-images').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
      if (error) throw error;
      cloudOk = true;
    } catch (e) {
      console.warn('Storage upload error:', e);
    }
  }
  await new Promise(res => {
    const r = new FileReader();
    r.onload = async () => { await idbPut('i:' + id, r.result); res(true); };
    r.readAsDataURL(blob);
  });
  return cloudOk;
}

// روابط موقّتة موقّعة (تعمل مع الحاوية الخاصة)، مع رجوع للرابط العام إن كانت الحاوية عامة
const urlCache = new Map();
async function imgGet(id){
  const rec = (S.imgs || []).find(x => x.id === id);
  if (sb && rec && rec.path) {
    const c = urlCache.get(rec.path);
    if (c && c.exp > Date.now()) return c.url;
    try {
      const { data, error } = await sb.storage.from('xray-images').createSignedUrl(rec.path, 3600);
      if (!error && data && data.signedUrl) {
        urlCache.set(rec.path, { url: data.signedUrl, exp: Date.now() + 50 * 60 * 1000 });
        return data.signedUrl;
      }
    } catch (e) {}
    try {
      const { data } = sb.storage.from('xray-images').getPublicUrl(rec.path);
      if (data && data.publicUrl) return data.publicUrl;
    } catch (e) {}
  }
  return await idbGet('i:' + id);
}

// يحذف السجل من قاعدة البيانات ثم الملف من المخزن. يرجع false إذا رفض الخادم أو انقطع الاتصال.
async function imgDel(id){
  const rec = (S.imgs || []).find(x => x.id === id);
  if (sb && rec) {
    const { error } = await sb.from('xray_records').delete().eq('id', id);
    if (error) { console.warn(error); return false; }
    if (rec.path) { try { await sb.storage.from('xray-images').remove([rec.path]); } catch (e) {} urlCache.delete(rec.path); }
  }
  await idbDel('i:' + id);
  return true;
}

async function upImg(inp){
  S.imgs = S.imgs || [];
  const L = list();
  if (!asel && L.length) asel = L[0].id;

  const D = ($('#idt') && $('#idt').value) ? $('#idt').value : date;
  let n = 0, bad = 0;
  setSt('⏳ جارٍ رفع وضغط صور الأشعة...');
  for (const f of [...inp.files]) {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast('نوع غير مسموح: ' + f.name); continue; }
    try {
      const blob = await shrinkBlob(f), id = uid(), path = `${asel}/${id}.jpg`;
      if (!await imgPut(id, blob, path)) { await idbDel('i:' + id); bad++; toast('تعذر رفع «' + f.name + '» إلى الخادم'); continue; }
      const { error } = await sb.from('xray_records').insert({ id, student_id: asel, type: T, session_date: D, file_name: f.name, storage_path: path, uploader_id: me.id, uploader_email: me.email, annotations: [] });
      if (error) { try { await sb.storage.from('xray-images').remove([path]); } catch (e) {} await idbDel('i:' + id); bad++; toast('رُفض تسجيل «' + f.name + '»: ' + errMsg(error)); continue; }
      S.imgs.push({ id, sid: asel, type: T, date: D, name: f.name, path, ann: [], cal: null });
      if (baseRows) baseRows.set('xray_records|' + id, { t: 'xray_records', row: { id, annotations: [], cal: null } });
      n++;
    } catch (e) {
      console.error(e);
      bad++;
      toast('تعذر معالجة: ' + f.name);
    }
  }
  inp.value = '';
  setSt(bad ? '⚠ فشل رفع ' + bad + ' صورة' : '☁ متزامن ' + nowT(), bad ? 'e' : undefined);
  if (!n) return;
  log('رفع ' + n + ' صورة شعاعية');
  await lSave();
  render();
  toast('تم رفع وحفظ ' + n + ' صورة شعاعية' + (bad ? ' (وفشل ' + bad + ')' : ''));
}

  await lSave();
  render();
}

    const nw = im.naturalWidth || im.clientWidth, nh = im.naturalHeight || im.clientHeight;
    return Math.hypot((a.x2 - a.x1) * nw, (a.y2 - a.y1) * nh);
  };
  const lenTxt = a => i.cal ? (npx(a) * i.cal).toFixed(1) + ' مم' : npx(a).toFixed(0) + ' px';

  function draw() {
    const c = cv.getContext('2d'), W = cv.width, H = cv.height;

    c.direction = 'ltr'; c.textAlign = 'left'; // الصفحة RTL فنثبّت اتجاه الكانفاس كي يتطابق النص مع مربعه
    (drag ? [...i.ann, drag] : i.ann).forEach(a => {
      const col = a.k === 'line' ? '#2fd0ff' : '#f4b400';
      const x1 = a.x1 * W, y1 = a.y1 * H, x2 = a.x2 * W, y2 = a.y2 * H;
      c.strokeStyle = col; c.fillStyle = col;
      let txt, tx, ty;
      if (a.k === 'line') {
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();

  };
  function setTool(t) {
    tool = t;
    cv.style.pointerEvents = t === 'view' ? 'none' : 'auto';
    cv.style.cursor = t === 'view' ? 'default' : 'crosshair';

  };

  cv.onpointerup = async () => {
    if (!drag) return;
    const a = drag; drag = null;
    if (Math.hypot(a.x2 - a.x1, a.y2 - a.y1) < 0.01) { draw(); return; } // نقرة عابرة
    a.by = me.u; a.t = new Date().toISOString().slice(0, 10);

  document.addEventListener('keydown', onKey);
  im.onload = fit;
  if (im.complete) fit();
  setTool('view');
  relist();
}

/* ---------- النسخ الاحتياطي الآمن: بصمة سلامة + تأكيد مكتوب ---------- */
async function sha(t){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function bak(){const pw=await dlg('كلمة سر لتشفير النسخة (اتركها فارغة لنسخة بدون تشفير):','');if(pw===null)return;
const data=JSON.stringify({...S,log:[]}),meta={app:'dentlab',ver:APP_VER,at:new Date().toISOString(),by:me.u,counts:{students:S.students.length,sessions:S.sessions.length,scores:Object.keys(S.sc).length},sha256:await sha(data)};
let out=JSON.stringify({meta,data});if(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),enc.encode(out));out=JSON.stringify({enc:1,s:b64(salt),i:b64(iv),c:b64(ct)})}
dl(out,'backup-'+todayL()+'.json');log('نسخة احتياطية: '+meta.counts.students+' طالب، بصمة '+meta.sha256.slice(0,12));toast('تم إنشاء النسخة · بصمة السلامة '+meta.sha256.slice(0,12))}
async function readB(f){let d=JSON.parse(await f.text());if(d.enc){const pw=await dlg('كلمة سر الملف:','');if(!pw)throw 0;d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(d.i)},await key(pw,ub(d.s)),ub(d.c))))}

function cellChanges(cur,base,del){const delSes=new Set((del.sessions||[]).map(r=>r.id)),delSt=new Set((del.students||[]).map(r=>r.id)),out=[],seen=new Set();
const val=e=>e?(e.t=='scores'?e.row.value:e.row.status):null;
for(const m of [cur,base])for(const [k,e] of m){if(seen.has(k)||(e.t!='scores'&&e.t!='attendance'))continue;seen.add(k);const a=base.get(k),b=cur.get(k),ov=val(a),nv=val(b);if(ov===nv)continue;const r=(b||a).row;
if(delSt.has(r.student_id)||(e.t=='attendance'&&delSes.has(r.session_id)))continue;
out.push(e.t=='scores'?{t:'scores',student_id:r.student_id,field:r.field,old:ov,new:nv}:{t:'attendance',session_id:r.session_id,student_id:r.student_id,old:ov,new:nv})}return out}

<div class=ls><table><tr><th>الطالب</th><th>البند</th><th>قيمتك</th><th>على الخادم الآن</th></tr>${conf.map(c=>{const [n,f]=cfLabel(c);return`<tr><td class=nm>${esc(n)}</td><td>${esc(f)}</td><td class=mine>${esc(cfVal(c,c.mine))}</td><td class=srv>${c.missing?'محذوف':esc(cfVal(c,c.server))}</td></tr>`}).join('')}</table></div>

/* ---------- التحقق الثنائي (MFA) ---------- */
async function mfaGate(){try{const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(a.error||!a.data||a.data.nextLevel!=='aal2'||a.data.currentLevel==='aal2')return true;

for(let i=0;i<3;i++){const code=await dlg('🔐 التحقق الثنائي\nأدخل الرمز المكوّن من 6 أرقام من تطبيق المصادقة على هاتفك (Google Authenticator أو Microsoft Authenticator):','');if(code===null)break;
const v=await sb.auth.mfa.challengeAndVerify({factorId:tf.id,code:String(code).replace(/\D/g,'')});if(!v.error)return true;toast('الرمز غير صحيح — حاول مرة أخرى')}
await sb.auth.signOut().catch(()=>0);toast('لم يكتمل التحقق الثنائي — أُلغي الدخول');return false}catch(e){console.warn(e);return true}}
function mfaBox(){if(mfaS===null){mfaS=0;sb.auth.mfa.listFactors().then(r=>{mfaS=r.error?{err:r.error.message}:{f:((r.data&&r.data.totp)||[])};if(view=='cfg'||view=='security')render()},e=>{mfaS={err:String(e)}})}
const h='<div class=box><h3>🔐 التحقق الثنائي لحسابك (MFA)</h3>';if(!mfaS)return h+'جارٍ التحقق…</div>';if(mfaS.err)return h+`<small>غير متاح: ${esc(mfaS.err)} — فعّل TOTP من لوحة Supabase ← Authentication ← Multi-Factor.</small></div>`;
const v=mfaS.f.filter(x=>x.status==='verified');
return h+(v.length?`<p><span class="tag ok">✓ مفعّل</span> عند الدخول يُطلب رمز من تطبيق المصادقة. صلاحيات المدير على الخادم لا تعمل إلا بعد إدخال الرمز.</p><button class=d onclick="mfaOff('${v[0].id}')">إلغاء التحقق الثنائي</button>`:`<p>غير مفعّل. <b>يُنصح بشدة</b> لحساب المدير: حتى لو سُرقت كلمة المرور لا يمكن الدخول بدون هاتفك.</p><button class=p onclick=mfaEnroll()>تفعيل التحقق الثنائي</button>`)+`<br><small>تحتاج تطبيق مصادقة مجاني على الهاتف: Google Authenticator أو Microsoft Authenticator. إذا فقدت الهاتف يزيل مدير قاعدة البيانات التحقق من Supabase (انظر دليل الحسابات).</small></div>`}

const r=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'مختبر الأشعة '+todayL()});if(r.error)return toast('تعذر بدء التفعيل: '+r.error.message);
const id=r.data.id,t=r.data.totp||{},qr=String(t.qr_code||''),src=qr.startsWith('data:')?qr:'data:image/svg+xml;utf8,'+encodeURIComponent(qr);
const el=document.createElement('div');el.className='modal';el.innerHTML=`<div><h3 style="margin-top:0">تفعيل التحقق الثنائي</h3><ol style="padding-right:18px;line-height:1.9"><li>افتح تطبيق المصادقة على هاتفك واضغط «+» ثم «مسح رمز QR».</li><li>امسح الرمز:</li></ol><div style="text-align:center"><span class=mfa-qr><img src="${src}" alt="QR"></span><br><small>أو أدخل المفتاح يدوياً: <code style="direction:ltr">${esc(t.secret||'')}</code></small></div><p>3. اكتب الرمز الظاهر في التطبيق:</p><input id=mfac inputmode=numeric autocomplete=one-time-code maxlength=6 style="font-size:22px;letter-spacing:6px;text-align:center;direction:ltr"><div class=tb style="margin-top:10px"><button class=p id=mfav>تأكيد</button><button class=s id=mfax>إلغاء</button></div></div>`;document.body.appendChild(el);
el.querySelector('#mfax').onclick=async()=>{el.remove();await sb.auth.mfa.unenroll({factorId:id}).catch(()=>0);mfaS=null;render()};

async function login(){
  const em = $('#lu').value.trim(), pw = $('#lp').value;
  if (!em || !pw) return toast('يرجى كتابة البريد وكلمة المرور');
  if (!sb) return toast('تعذر تحميل مكتبة الاتصال بالخادم — تحقق من الإنترنت');
  setSt('⏳ جارٍ التحقق من الحساب...');
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pw });
    if (error) throw error;
    if (!await mfaGate()) { me = null; return render(); }
    if (!await openSession(data.user)) return render();
    log('تسجيل دخول: ' + me.u);
    sb.rpc('log_event', { k: 'login', ua: navigator.userAgent }).then(() => 0, () => 0);
    render();
    toast('مرحباً ' + me.u + ' — ' + RN[me.r]);
  } catch (err) {
    console.error(err);
    me = null; S = fresh(); baseRows = null;
    sb.auth.signOut().catch(() => 0);
    toast('فشل الدخول: ' + (/invalid login/i.test(err.message || '') ? 'البريد أو كلمة المرور غير صحيحة' : (err.message || 'خطأ غير معروف')));
    setSt('⚠ تعذر الدخول', 'e');
  }
}

async function logout(auto){
  if (!me) return;
  clearTimeout(syncTimer);
  if (pending()) await syncUp().catch(() => 0);
  const left = pending();
  if (left && !auto && !await dlg('توجد تعديلات لم تُرفع إلى الخادم (لا يوجد اتصال).\nإذا خرجت الآن ستُحذف من هذا الجهاز.\nهل تريد الخروج رغم ذلك؟')) return;
  if (!(left && auto)) await wipeLocal(); // عند الخروج التلقائي مع تعديلات معلقة نبقيها لنفس المستخدم فقط
  try { await sb.rpc('log_event', { k: auto ? 'timeout' : 'logout', ua: navigator.userAgent }); } catch (e) {}
  try { await sb.auth.signOut(); } catch (e) {}
  if (remoteChannel) { try { sb.removeChannel(remoteChannel); } catch (e) {} remoteChannel = null; }
  clearTimeout(idleT);
  me = null; S = fresh(); baseRows = null; staff = null; audit = null; chk = null;
  menuOpen = false; view = 'dash'; gsel = ''; sel.clear(); rep = null; pend = null; bkM = null;
  document.querySelectorAll('.modal').forEach(x => x.remove());
  setSt('☁ جاهز لتسجيل الدخول');
  render();
}

async function key(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

const f=(a,b,k)=>{if(b===''||b==null)return;if(a[k]===''||a[k]==null){a[k]=b;nv++}else if(a[k]!=b)cf++};
Object.entries(d.sc||{}).forEach(([id,c])=>{const t=map[id];if(!t)return;const L=S.sc[t]=S.sc[t]||{};Object.keys(c).filter(k=>k!='w').forEach(k=>f(L,c[k],k));Object.entries(c.w||{}).forEach(([w,v])=>{L.w=L.w||{};f(L.w,v,w)})});
(d.sessions||[]).forEach(x=>{let l=S.sessions.find(y=>y.gid==x.gid&&y.date==x.date);if(!l){l={id:x.gid+'_'+x.date,gid:x.gid,date:x.date,a:{}};S.sessions.push(l)}Object.entries(x.a).forEach(([id,v])=>{const t=map[id];if(!t)return;if(!l.a[t]){l.a[t]=v;nv++}else if(l.a[t]!=v)cf++})});
log(`دمج: ${ns} طالب جديد، ${nv} قيمة، ${cf} تعارض`);await commit();toast(`تم الدمج: +${ns} طالب، +${nv} قيمة، ${cf} تعارض (بقيت القيمة المحلية)`)}catch(e){toast('تعذر الدمج أو كلمة السر خاطئة')}i.value=''}

function bell(a){if(a.length<2)return'<small>يلزم نتائج طالبين على الأقل</small>';const n=a.length,m=a.reduce((x,y)=>x+y)/n,sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n)||1,B=Array(10).fill(0),P=[];a.forEach(v=>B[Math.min(9,Math.max(0,v/10|0))]++);const mx=Math.max(...B);for(let x=0;x<=100;x+=2)P.push((x*5.6+14)+','+(110-Math.exp(-((x-m)**2)/(2*sd*sd))*95));
