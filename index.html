<link rel=preconnect href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel=stylesheet><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{--n:#0d0d0f;--b:#c9a24b;--g:#f5f2ea;--l:#e4dcc6;--t:#1b1b1d;--gd:#a8832a}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--g);color:var(--t);font-size:15px}
header{background:var(--n);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px}header img{height:46px;background:#fff;border-radius:50%;padding:2px}header h1{font-size:16px;margin:0;flex:1}
#wrap{display:flex;min-height:calc(100vh - 62px)}nav{width:190px;background:#fff;border-left:1px solid var(--l);padding:10px;flex-shrink:0}
nav button{display:block;width:100%;text-align:right;border:0;background:none;padding:11px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:3px}nav button.on,nav button:hover{background:var(--n);color:#fff}
main{flex:1;padding:14px;min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card,.box{background:#fff;border-radius:10px;padding:14px;border:1px solid var(--l);margin-bottom:12px}.card small{display:block;color:#7a7260}.card b{font-size:26px;color:var(--n)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar b{width:70px}.bar i{display:block;height:14px;background:var(--b);border-radius:7px;min-width:2px}
table{border-collapse:collapse;width:100%;background:#fff}th{background:var(--n);color:#fff;position:sticky;top:0}th,td{border:1px solid var(--l);padding:7px;text-align:center}td.nm{text-align:right;min-width:170px}
.sc{overflow:auto;max-height:70vh;border-radius:8px}input,select,textarea{font:inherit;padding:7px;border:1px solid #d3c7a6;border-radius:7px}td input{width:72px;text-align:center}
button.p,button.s,.fl{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;display:inline-block}button.p{background:var(--b);color:#fff}button.s{background:#efe9d8;color:var(--n)}button.d{background:#b3261e;color:#fff;border:0;border-radius:6px;padding:4px 9px;cursor:pointer}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tag{background:#f4b400;color:#000;border-radius:6px;padding:1px 6px;font-size:12px}.ok{background:#1e8e5a;color:#fff}
.a button{border:1px solid #d3c7a6;background:#fff;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}.a .on1{background:#1e8e5a;color:#fff}.a .on2{background:#b3261e;color:#fff}.a .on3{background:#f4b400}
#toast{position:fixed;bottom:16px;left:16px;background:var(--n);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.lg{max-width:340px;margin:8vh auto}.lg>*{display:block;width:100%;margin-bottom:10px}
@media(max-width:700px){#wrap{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;border:0}nav button{white-space:nowrap;width:auto}td input{width:58px}}
.layout{display:flex;align-items:flex-start;width:100%}
.side{width:200px;flex-shrink:0;background:#fff;border-left:1px solid var(--l);padding:10px;position:sticky;top:0;min-height:calc(100vh - 62px);display:flex;flex-direction:column;gap:3px}
.side button{display:block;width:100%;text-align:right;border:0;background:none;padding:11px;border-radius:8px;font:inherit;cursor:pointer;margin:0}
.side button.on,.side button:hover{background:var(--n);color:#fff}
.side .who{margin-top:auto;padding:10px 4px;font-size:13px;color:#7a7260}
.side .who button{display:inline-block;width:auto;background:#efe9d8;color:var(--n);margin-top:6px;padding:6px 12px}
.mbar,.ov{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.modal>div{background:#fff;border-radius:12px;padding:16px;max-width:480px;width:100%;max-height:85vh;display:flex;flex-direction:column}
.modal .ls{overflow:auto;flex:1;margin:10px 0}.modal label.r{display:block;padding:6px 0;border-bottom:1px solid var(--l)}
@media print{.side,.mbar,header,.tb{display:none!important}.sc{max-height:none}}
@media(max-width:700px){.layout{display:block}.side{position:fixed;top:0;right:0;bottom:0;width:230px;min-height:0;z-index:15;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 16px rgba(0,0,0,.3);overflow-y:auto}.side.open{transform:none}.mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l);padding:8px 12px}.ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:14}}

body{font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(135deg,#000,#1c1c20);border-bottom:3px solid var(--b)}
header h1 small{color:var(--b);font-weight:400}header img{box-shadow:0 0 0 2px var(--b)}
button.p,.fl.p{background:var(--b);color:#000;font-weight:700}button.s,.fl.s,.side .who button{background:#efe9d8;color:#111}
input,select,textarea{border-color:#d3c7a6}input:focus,select:focus,textarea:focus{outline:2px solid var(--b)}
th{background:#0d0d0f;color:var(--b)}.card{border-top:3px solid var(--b);box-shadow:0 2px 8px rgba(0,0,0,.06)}.card b{color:#111}
.bar i{background:linear-gradient(90deg,var(--gd),var(--b))}
.side button.on,.side button:hover{background:#0d0d0f;color:var(--b)}.side button.on{box-shadow:inset -4px 0 0 var(--b)}
.tag,.a .on3{background:var(--b);color:#000}#toast{border:1px solid var(--b)}
.hero{background:linear-gradient(135deg,#000,#26262b);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:12px;border-right:5px solid var(--b)}.hero b{color:var(--b)}.hero small{color:#bbb}
.gd{display:inline-block;border-radius:6px;padding:1px 8px;background:#111;color:var(--b);font-size:13px}.gd.f{background:#b3261e;color:#fff}
.ft{text-align:center;color:#8a8268;font-size:12px;padding:16px 0 4px}.pho{display:none}
.lgn{border-top:4px solid var(--b);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
@media print{.pho{display:block}th{background:#000!important;color:#c9a24b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}body.prm .layout,body.prm header{display:none!important}body.prm .modal{position:static;background:none;display:block;padding:0}body.prm .modal>div{max-height:none;box-shadow:none;max-width:none}body.prm .modal .tb{display:none}}
.al{border-radius:6px;padding:1px 7px;font-size:12px;color:#fff}.al.y{background:#c9a24b;color:#000}.al.o{background:#e07b1a}.al.r{background:#b3261e}
.box ul{padding-right:22px;line-height:1.9}.box code{background:#f1eee6;padding:2px 5px;border-radius:4px;direction:ltr;display:inline-block}.modal{animation:fi .2s}.modal>div{animation:up .25s}@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(14px);opacity:0}}
.xr{position:relative;background:#050506;border:2px solid var(--b);border-radius:14px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.xr svg{display:block;width:100%;height:auto}.xr .scan{animation:sc 3.6s ease-in-out infinite alternate}
@keyframes sc{from{transform:translateX(0)}to{transform:translateX(560px)}}
.xr .cap{position:absolute;inset:auto 0 0 0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;direction:ltr;text-align:left}
.xr .cap b{display:block;font-size:22px;letter-spacing:3px;color:var(--b)}.xr .cap small{color:#ccc;letter-spacing:1px}
.side button{display:flex;align-items:center;gap:10px;min-height:46px}.side button small{display:block;font-size:10px;opacity:.65}.ic{width:22px;text-align:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gal figure{margin:0;background:#0d0d0f;color:#fff;border-radius:10px;overflow:hidden;font-size:12px}.gal img{width:100%;height:120px;object-fit:cover;background:#000;display:block}.gal figcaption{padding:6px}
.dk{background:#06070a;border-radius:16px;padding:12px;color:#e8e6df}.dk small{color:#9aa0ab}
.hero2{display:flex;align-items:center;gap:16px;min-height:150px;border:1px solid #3a3322;border-radius:14px;padding:16px;background-size:cover;background-position:left center;margin-bottom:12px}.hero2 img{height:84px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 0 0 2px #c9a24b}.hero2 h2{margin:2px 0;font-size:26px;background:linear-gradient(90deg,#f1d98a,#b8892b);-webkit-background-clip:text;color:transparent}.hero2 b{color:#c9a24b;letter-spacing:1px}.hero2 span{display:block;font-size:13px}
.g4,.g3{display:grid;gap:10px;margin-bottom:10px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.dc,.dp{background:linear-gradient(145deg,#141821,#0b0d12);border:1px solid #262b36;border-radius:14px;padding:14px}.dc{display:flex;gap:12px;align-items:center}.dc b{display:block;font-size:26px;color:#fff}.dc em{font-style:normal;font-size:12px;color:#c9a24b}.ib{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.dp h3{margin:0 0 10px;font-size:15px;color:#f1d98a}.dp .bar b{color:#ddd}.dp .bar i{background:linear-gradient(90deg,#8a6a22,#e2c06a)}
.cols{display:flex;gap:10px;align-items:flex-end;height:170px}.cols div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end}.cols i{display:block;background:linear-gradient(#e2c06a,#8a6a22);border-radius:4px 4px 0 0}
.ac{padding:7px 0;border-bottom:1px solid #20242e;font-size:13px}.ac small{display:block}
button.tile{background:linear-gradient(145deg,#141821,#0b0d12);border:1px solid #262b36;color:#fff;border-radius:14px;padding:16px;text-align:right;font-weight:700;min-height:72px}button.tile small{display:block;font-weight:400}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.hero2{flex-direction:column;text-align:center}}

const idb = () => new Promise((res, rej) => {
  try {

    q.onupgradeneeded = () => q.result.createObjectStore('k');
    q.onsuccess = () => res(q.result);

});
const idbPut = async (k, v) => {
  try {
    const d = await idb();
    return new Promise((res, rej) => {
      const tx = d.transaction('k', 'readwrite');
      tx.objectStore('k').put(v, k);
      tx.oncomplete = () => res(1);
      tx.onerror = tx.onabort = () => rej(tx.error || new Error('abort'));

  } catch (e) { return 0; }
};
const idbGet = async k => {

};

/* ===== تحويل حالة البرنامج إلى صفوف جداول، ومقارنتها لرفع ما تغيّر فقط ===== */
function rowsOf(s) {
  const m = new Map(), put = (t, k, row) => m.set(t + '|' + k, { t, row });
  if (!s) return m;
  put('app_settings', 'main', { id: 'main', cfg: s.cfg });
  (s.groups || []).forEach((g, i) => put('groups', g.id, { id: g.id, name: g.name, sort: g.sort ?? i }));
  const sid = new Set();
  (s.students || []).forEach(x => { sid.add(x.id); put('students', x.id, { id: x.id, name: x.name, group_id: x.gid, demo: !!x.demo }); });
  (s.sessions || []).forEach(x => {
    put('sessions', x.id, { id: x.id, group_id: x.gid, session_date: x.date, demo: !!x.demo });
    Object.entries(x.a || {}).forEach(([st, v]) => { if (v && sid.has(st)) put('attendance', x.id + '|' + st, { session_id: x.id, student_id: st, status: v }); });
  });
  Object.entries(s.sc || {}).forEach(([st, c]) => {
    if (!sid.has(st) || !c) return;
    ['prac', 'exam', 'act', 'note'].forEach(f => { const v = c[f]; if (v !== '' && v != null) put('scores', st + '|' + f, { student_id: st, field: f, value: String(v) }); });
    Object.entries(c.w || {}).forEach(([w, v]) => { if (v !== '' && v != null) put('scores', st + '|w' + w, { student_id: st, field: 'w' + w, value: String(v) }); });
  });
  (s.imgs || []).forEach(i => put('xray_records', i.id, { id: i.id, annotations: i.ann || [], cal: i.cal == null ? null : i.cal }));
  return m;
}

async function push() {
  const cur = rowsOf(S), base = baseRows || new Map(), up = {}, del = {};

  for (const [k, v] of base) if (!cur.has(k)) (del[v.t] = del[v.t] || []).push(v.row);
  const ck = (a, n = 400) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
  const by = (a, k) => a.reduce((m, r) => ((m[r[k]] = m[r[k]] || []).push(r), m), {});
  const ok = r => { if (r.error) throw r.error; };
  // الحذف أولاً: الأبناء قبل الآباء
  for (const [sid, rs] of Object.entries(by(del.scores || [], 'student_id'))) ok(await sb.from('scores').delete().eq('student_id', sid).in('field', rs.map(r => r.field)));
  for (const [ses, rs] of Object.entries(by(del.attendance || [], 'session_id'))) ok(await sb.from('attendance').delete().eq('session_id', ses).in('student_id', rs.map(r => r.student_id)));

}

async function all(t) {

}
// يجلب الحالة الكاملة من الخادم. لا يستبدل البيانات إذا عدّل المستخدم شيئاً أثناء الجلب.
async function pull() {
  const mark = S && baseRows ? J([...rowsOf(S)]) : null;
  const [g, st, ss, at, sc, xr, cf] = await Promise.all([all('groups'), all('students'), all('sessions'), all('attendance'), all('scores'), all('xray_records'),
    sb.from('app_settings').select('cfg').eq('id', 'main').maybeSingle()]);
  if (cf.error) throw cf.error;
  if (mark !== null && J([...rowsOf(S)]) !== mark) { clearTimeout(rmT); rmT = setTimeout(refresh, 1500); return false; }
  const d = fresh(), c0 = d.cfg, c = (cf.data && cf.data.cfg) || {};
  d.cfg = { ...c0, ...c, w: { ...c0.w, ...(c.w || {}) } };
  d.groups = g.sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name), 'ar')).map(x => ({ id: x.id, name: x.name, sort: x.sort || 0 }));
  d.students = st.sort((a, b) => (a.seq || 0) - (b.seq || 0)).map(x => x.demo ? { id: x.id, name: x.name, gid: x.group_id, demo: true } : { id: x.id, name: x.name, gid: x.group_id });
  const SM = {};
  d.sessions = ss.sort((a, b) => a.session_date < b.session_date ? -1 : 1).map(x => (SM[x.id] = x.demo ? { id: x.id, gid: x.group_id, date: x.session_date, demo: true, a: {} } : { id: x.id, gid: x.group_id, date: x.session_date, a: {} }));
  at.forEach(r => { if (SM[r.session_id]) SM[r.session_id].a[r.student_id] = r.status; });
  sc.forEach(r => { const o = d.sc[r.student_id] = d.sc[r.student_id] || {}; if (/^w\d+$/.test(r.field)) (o.w = o.w || {})[r.field.slice(1)] = r.value; else o[r.field] = r.value; });
  d.imgs = xr.sort((a, b) => String(a.created_at || '') < String(b.created_at || '') ? -1 : 1).map(x => ({ id: x.id, sid: x.student_id, type: x.type, date: x.session_date, name: x.file_name, path: x.storage_path, ann: Array.isArray(x.annotations) ? x.annotations : [], cal: x.cal == null ? null : +x.cal }));
  if (S) { d.log = S.log || []; d.lastImp = S.lastImp; }
  S = d;
  baseRows = rowsOf(S);
  return true;
}

async function lSave() {
  if (!me || !S) return false;
  try {
    if (!(await idbPut('s', S))) return false;
    await idbPut('meta', { base: baseRows ? [...baseRows] : null, dirty: pending(), uid: me.id });
    try { snap(await idb()); } catch (_) {}
    return true;
  } catch (e) { return false; }
}
// نقطة استرجاع محلية كل 5 دقائق كحد أدنى، نحتفظ بآخر 5
function snap(d) {
  const now = Date.now();
  if (now - (snap.last || 0) < 300000) return;
  snap.last = now;
  const os = d.transaction('k', 'readwrite').objectStore('k');
  os.get('bk').onsuccess = e => {
    const a = e.target.result || [];
    a.unshift({ t: now, d: JSON.stringify(S) });
    os.put(a.slice(0, 5), 'bk');
  };
}

// يرجع: true نجح، false لا يوجد اتصال (محفوظ محلياً)، null رفضه الخادم (أُعيدت بيانات الخادم)
async function syncUp() {
  if (!sb || !me) return false;
  if (syncing) { again = true; return true; }
  syncing = true;
  clearTimeout(syncTimer);
  try {
    await lSave();
    if (!pending()) { setSt('☁ متزامن ' + nowT()); return true; }
    setSt('⏳ جارٍ الحفظ على الخادم...');
    await push();
    await lSave();
    setSt('☁ متزامن ' + nowT());
    return true;
  } catch (err) {
    console.error(err);
    if (rejected(err)) {
      toast('⛔ رفض الخادم التعديل: ' + errMsg(err) + ' — أُعيدت البيانات كما هي على الخادم');
      setSt('⛔ رُفض تعديل: ' + errMsg(err), 'e');
      try { await pull(); await lSave(); } catch (_) {}
      softRender();
      return null;
    }
    setSt('⚠ لا يوجد اتصال — التعديلات محفوظة على هذا الجهاز وستُرفع تلقائياً', 'e');
    return false;
  } finally {
    syncing = false;
    if (again) { again = false; syncUp().catch(() => 0); }
  }
}
const save = async crit => {
  if (!sb || !me) return false;
  clearTimeout(syncTimer);
  if (crit) return await syncUp();
  lSave();
  syncTimer = setTimeout(() => syncUp().catch(() => 0), 1200);
  return true;
};

function softRender() { // لا نقطع الكتابة: إذا كان المستخدم يكتب درجة نؤجل إعادة الرسم
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'q' && a.id !== 'lu' && a.id !== 'lp') {
    if (!lateRender) {
      lateRender = true;
      toast('وصلت تحديثات من زميل — ستظهر بعد إنهاء الإدخال');
      a.addEventListener('blur', () => setTimeout(() => { lateRender = false; render(); }, 250), { once: true });
    }
    return;
  }
  render();
}

/* ===== التحديث الفوري: أي تغيير من زميل يصل خلال ثوانٍ ===== */
function setupRealtime() {
  if (!sb || remoteChannel) return;
  let ch = sb.channel('dentlab-db');
  TBL.forEach(t => { ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => { clearTimeout(rmT); rmT = setTimeout(refresh, 700); }); });
  remoteChannel = ch.subscribe();
}
async function refresh() {
  if (!me || !sb) return;
  if (syncing) { clearTimeout(rmT); rmT = setTimeout(refresh, 800); return; }
  try {
    if (pending()) { const ok = await syncUp(); if (ok === false) return; }
    const before = J([...(baseRows || [])]);
    if (!await pull()) return;
    if (J([...baseRows]) !== before) { await lSave(); setSt('⚡ تحديث من زميل ' + nowT()); softRender(); }
    else setSt('☁ متزامن ' + nowT());
  } catch (e) { console.warn(e); }
}

async function getMe(user) {
  const { data: p, error } = await sb.from('staff_profiles').select('full_name,role,active').eq('id', user.id).maybeSingle();
  if (error) throw error;
  if (!p || !p.active || !PERM[p.role]) return null;
  return { id: user.id, u: p.full_name || user.email.split('@')[0], email: user.email, r: p.role };
}
async function openSession(user) {
  const m = await getMe(user);
  if (!m) {
    await sb.auth.signOut().catch(() => 0);
    toast('حسابك غير مفعّل بعد أو لا يملك صلاحية. اطلب من مدير النظام تفعيله.');
    setSt('⛔ حساب غير مفعّل', 'e');
    return false;
  }
  me = m;
  let L = null, meta = null;
  try { L = await idbGet('s'); meta = await idbGet('meta'); } catch (e) {}
  const mine = !!(L && meta && meta.uid === me.id);
  if (!mine && (L || meta)) await wipeLocal(); // بيانات مستخدم آخر على نفس الجهاز: تُمسح
  if (mine && meta.dirty && meta.base) { S = L; S.imgs = S.imgs || []; baseRows = new Map(meta.base); await syncUp(); }
  if (mine && pending()) setSt('⚠ تعديلات بانتظار الرفع — ستُرفع عند عودة الاتصال', 'e');
  else {
    try { await pull(); await lSave(); setSt('☁ متصل ومتزامن ' + nowT()); }
    catch (e) {
      if (!mine) throw e;
      S = L; S.imgs = S.imgs || []; baseRows = meta.base ? new Map(meta.base) : rowsOf(S);
      setSt('⚠ وضع غير متصل — تُعرض آخر نسخة على هذا الجهاز', 'e');
    }
  }
  setupRealtime();
  bump();
  return true;
}

const TN = { groups: 'كروب', students: 'طالب', sessions: 'جلسة حضور', attendance: 'حضور', scores: 'درجة', app_settings: 'الإعدادات', xray_records: 'صورة شعاعية', staff_profiles: 'حساب كادر', staff_groups: 'إسناد كروب' };
const OPN = { INSERT: 'إضافة', UPDATE: 'تعديل', DELETE: 'حذف' }, STN = { p: 'حاضر', a: 'غائب', e: 'مجاز' };

function auDesc(r) {
  const o = r.old_data || {}, n = r.new_data || {}, d = r.new_data || r.old_data || {};
  const sn = id => (S.students.find(s => s.id == id) || {}).name || ('#' + id);
  const ch = (a, b) => r.op == 'UPDATE' ? `من «${a ?? '—'}» إلى «${b ?? '—'}»` : r.op == 'INSERT' ? `«${b ?? '—'}»` : `كانت «${a ?? '—'}»`;
  switch (r.tbl) {
    case 'scores': return `${FLN(d.field)} — ${sn(d.student_id)}: ${ch(o.value, n.value)}`;
    case 'attendance': return `${sn(d.student_id)} · ${(S.sessions.find(s => s.id == d.session_id) || {}).date || d.session_id}: ${ch(STN[o.status], STN[n.status])}`;
    case 'students': return r.op == 'UPDATE' ? ch(o.name, n.name) + (o.group_id != n.group_id ? ` · نُقل من ${gname(o.group_id) || o.group_id} إلى ${gname(n.group_id) || n.group_id}` : '') : `${d.name} (${gname(d.group_id) || d.group_id})`;
    case 'sessions': return `${gname(d.group_id) || d.group_id} · ${d.session_date}`;
    case 'groups': return ch(o.name, n.name);
    case 'xray_records': return `${sn(d.student_id)} · ${d.type || ''} · ${d.file_name || ''}${r.op == 'UPDATE' ? ' · تحديث التعليقات/القياس' : ''}`;
    case 'staff_profiles': return `${d.email || d.full_name || ''}${r.op == 'UPDATE' ? ' · الدور ' + ch(RN[o.role] || o.role, RN[n.role] || n.role) + ' · ' + (n.active ? 'مفعّل' : 'معطّل') : ''}`;

    default: return '';
  }
}

async function runChecks() {

    const anon = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'dl-anon-check' } });
    const leak = [];

    const p = await sb.from('staff_profiles').select('role,active');

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function grade(p){const L=S.cfg.scale.split('\n').map(x=>x.split('=')).filter(x=>x.length==2).map(x=>[+x[0],x[1].trim()]).sort((a,b)=>b[0]-a[0]);return(L.find(x=>p>=x[0])||['','—'])[1]}
function comps(s){const c=S.sc[s.id]||{},w=Object.values(c.w||{}).filter(v=>v!==''&&v!=null).map(Number).sort((a,b)=>a-b).slice(Math.min(+S.cfg.drop||0,Math.max(0,Object.values(c.w||{}).filter(v=>v!==''&&v!=null).length-1)));let p=0,n=0;

function res(s){const c=comps(s),W=S.cfg.w;let sw=0,sv=0,miss=[];

function shrinkBlob(f){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('فشل قراءة الملف'));
    reader.onload = e => {
      const im = new Image();
      im.onerror = () => rej(new Error('فشل معالجة الصورة'));
      im.onload = () => {
        const maxDim = 1600; // دقة أعلى للأشعة (كانت 1000)
        let w = im.width, h = im.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(im, 0, 0, w, h);
        canvas.toBlob(blob => blob ? res(blob) : rej(new Error('فشل ضغط الصورة')), 'image/jpeg', 0.85);
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

const idbDel = async k => { try { const d = await idb(); d.transaction('k', 'readwrite').objectStore('k').delete(k); } catch (e) {} };

// يرجع true فقط إذا نجح الرفع السحابي (سابقاً كان الفشل يُتجاهل فتبقى الصورة على جهاز واحد)
async function imgPut(id, blob, path){
  let cloudOk = false;
  if (sb && blob) {
    try {
      const { error } = await sb.storage.from('xray-images').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
      if (error) throw error;
      cloudOk = true;
    } catch (e) {
      console.warn('Storage upload error:', e);
    }
  }
  await new Promise(res => {
    const r = new FileReader();
    r.onload = async () => { await idbPut('i:' + id, r.result); res(true); };
    r.readAsDataURL(blob);
  });
  return cloudOk;
}

// روابط موقّتة موقّعة (تعمل مع الحاوية الخاصة)، مع رجوع للرابط العام إن كانت الحاوية عامة
const urlCache = new Map();
async function imgGet(id){
  const rec = (S.imgs || []).find(x => x.id === id);
  if (sb && rec && rec.path) {
    const c = urlCache.get(rec.path);
    if (c && c.exp > Date.now()) return c.url;
    try {
      const { data, error } = await sb.storage.from('xray-images').createSignedUrl(rec.path, 3600);
      if (!error && data && data.signedUrl) {
        urlCache.set(rec.path, { url: data.signedUrl, exp: Date.now() + 50 * 60 * 1000 });
        return data.signedUrl;
      }
    } catch (e) {}
    try {
      const { data } = sb.storage.from('xray-images').getPublicUrl(rec.path);
      if (data && data.publicUrl) return data.publicUrl;
    } catch (e) {}
  }
  return await idbGet('i:' + id);
}

// يحذف السجل من قاعدة البيانات ثم الملف من المخزن. يرجع false إذا رفض الخادم أو انقطع الاتصال.
async function imgDel(id){
  const rec = (S.imgs || []).find(x => x.id === id);
  if (sb && rec) {
    const { error } = await sb.from('xray_records').delete().eq('id', id);
    if (error) { console.warn(error); return false; }
    if (rec.path) { try { await sb.storage.from('xray-images').remove([rec.path]); } catch (e) {} urlCache.delete(rec.path); }
  }
  await idbDel('i:' + id);
  return true;
}

    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast('نوع غير مسموح: ' + f.name); continue; }
    try {
      const blob = await shrinkBlob(f), id = uid(), path = `${asel}/${id}.jpg`;
      if (!await imgPut(id, blob, path)) { await idbDel('i:' + id); bad++; toast('تعذر رفع «' + f.name + '» إلى الخادم'); continue; }
      const { error } = await sb.from('xray_records').insert({ id, student_id: asel, type: T, session_date: D, file_name: f.name, storage_path: path, uploader_id: me.id, uploader_email: me.email, annotations: [] });
      if (error) { try { await sb.storage.from('xray-images').remove([path]); } catch (e) {} await idbDel('i:' + id); bad++; toast('رُفض تسجيل «' + f.name + '»: ' + errMsg(error)); continue; }
      S.imgs.push({ id, sid: asel, type: T, date: D, name: f.name, path, ann: [], cal: null });
      if (baseRows) baseRows.set('xray_records|' + id, { t: 'xray_records', row: { id, annotations: [], cal: null } });
      n++;
    } catch (e) {
      console.error(e);
      bad++;
      toast('تعذر معالجة: ' + f.name);
    }
  }
  inp.value = '';
  setSt(bad ? '⚠ فشل رفع ' + bad + ' صورة' : '☁ متزامن ' + nowT(), bad ? 'e' : undefined);
  if (!n) return;
  log('رفع ' + n + ' صورة شعاعية');
  await lSave();
  render();
  toast('تم رفع وحفظ ' + n + ' صورة شعاعية' + (bad ? ' (وفشل ' + bad + ')' : ''));
}

          <button class=s id=vnext ${pos < mine.length - 1 ? '' : 'disabled'}>‹</button>
          <button class=s id=vx>✕ إغلاق</button>
        </div>
      </div>
      <div style="background:#000;border-radius:8px;margin:10px 0;text-align:center;overflow:auto;max-height:58vh">
        <div style="position:relative;display:inline-block;line-height:0">
          <img id=vi src="${esc(d)}" alt="" style="max-width:100%;max-height:56vh;display:block">
          <canvas id=aiCanvas style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none"></canvas>
        </div>
      </div>
      <div class=tb style="justify-content:space-between">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${canAnn ? `
          <button class=s data-tool=view>✋ عرض</button>

        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <small>سطوع</small><input type=range id=vb min=50 max=200 value=100 oninput=vf() style="width:70px">
          <small>تباين</small><input type=range id=vc min=50 max=250 value=100 oninput=vf() style="width:70px">
          <label><input type=checkbox id=vn onchange=vf()> عكس</label>
        </div>
      </div>
      <div id=alist style="background:#141821;border:1px solid #262b36;border-radius:8px;padding:8px 12px;font-size:13px;color:#f1d98a"></div>
      <div class=tb style="margin-top:8px">${canAnn && student ? '<button class=s id=anote>إدراج ملخص التعليقات في ملاحظات الطالب</button>' : ''}</div>
      <small style="color:#8a8268">التعليقات والقياسات يدوية من المستخدم وللأغراض التعليمية فقط — لا يقوم البرنامج بأي تشخيص آلي. القياس تقريبي ولا يُعتمد سريرياً.</small>
    </div>`;
  document.body.appendChild(m);

  const im = m.querySelector('#vi'), cv = m.querySelector('#aiCanvas'), AL = m.querySelector('#alist');
  let tool = 'view', drag = null;

  const npx = a => { // طول الخط بالبكسل الأصلي للصورة
    const nw = im.naturalWidth || im.clientWidth, nh = im.naturalHeight || im.clientHeight;
    return Math.hypot((a.x2 - a.x1) * nw, (a.y2 - a.y1) * nh);
  };
  const lenTxt = a => i.cal ? (npx(a) * i.cal).toFixed(1) + ' مم' : npx(a).toFixed(0) + ' px';

  function draw() {
    const c = cv.getContext('2d'), W = cv.width, H = cv.height;
    c.clearRect(0, 0, W, H);
    c.lineWidth = 2;
    c.font = 'bold 12px Cairo, Tahoma';
    c.direction = 'ltr'; c.textAlign = 'left'; // الصفحة RTL فنثبّت اتجاه الكانفاس كي يتطابق النص مع مربعه
    (drag ? [...i.ann, drag] : i.ann).forEach(a => {
      const col = a.k === 'line' ? '#2fd0ff' : '#f4b400';
      const x1 = a.x1 * W, y1 = a.y1 * H, x2 = a.x2 * W, y2 = a.y2 * H;
      c.strokeStyle = col; c.fillStyle = col;
      let txt, tx, ty;
      if (a.k === 'line') {
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
        txt = lenTxt(a); tx = Math.min(x1, x2); ty = Math.min(y1, y2) - 4;
      } else {
        tx = Math.min(x1, x2); ty = Math.min(y1, y2);
        c.strokeRect(tx, ty, Math.abs(x2 - x1), Math.abs(y2 - y1));
        txt = a.l; ty -= 4;
      }
      ty = Math.max(16, ty);
      const tw = c.measureText(txt).width;
      c.fillRect(tx, ty - 14, tw + 8, 17);
      c.fillStyle = '#000';
      c.fillText(txt, tx + 4, ty - 1);
    });
  }
  function fit() {
    if (!im.clientWidth) return;
    cv.width = im.clientWidth; cv.height = im.clientHeight;
    draw();
  }
  function relist() {
    AL.innerHTML = i.ann.length
      ? i.ann.map((a, n) => `<div class=ac style="border-color:#262b36">${a.k === 'line' ? '📏 قياس: <b>' + esc(lenTxt(a)) + '</b>' : '▭ <b>' + esc(a.l) + '</b>'}
          <small>${esc(a.by || '')} · ${esc(a.t || '')}${canAnn ? ` · <a href="#" data-del="${n}" style="color:#ff8a80">حذف</a>` : ''}</small></div>`).join('')
      : '<small>لا توجد تعليقات على هذه الصورة بعد.</small>';
    if (i.cal) AL.innerHTML += `<small>المعايرة: 1 بكسل = ${i.cal.toFixed(4)} مم</small>`;
  }
  async function persist() {
    log('تعديل تعليقات صورة شعاعية');
    const ok = await save(true);
    if (!ok) toast('⚠ لم يُرفع الحفظ السحابي (محفوظ محلياً)');
  }
  const pt = e => {
    const r = cv.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
  };
  function setTool(t) {
    tool = t;
    cv.style.pointerEvents = t === 'view' ? 'none' : 'auto';
    cv.style.cursor = t === 'view' ? 'default' : 'crosshair';
    m.querySelectorAll('[data-tool]').forEach(b => { b.className = b.dataset.tool === t ? 'p' : 's'; });
  }

  cv.onpointerdown = e => {
    if (tool === 'view' || !canAnn) return;
    cv.setPointerCapture(e.pointerId);
    const p = pt(e), lb = m.querySelector('#albl');
    drag = { k: tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y, l: lb ? lb.value : '' };
  };
  cv.onpointermove = e => { if (!drag) return; const p = pt(e); drag.x2 = p.x; drag.y2 = p.y; draw(); };
  cv.onpointerup = async () => {
    if (!drag) return;
    const a = drag; drag = null;
    if (Math.hypot(a.x2 - a.x1, a.y2 - a.y1) < 0.01) { draw(); return; } // نقرة عابرة
    a.by = me.u; a.t = new Date().toISOString().slice(0, 10);
    i.ann.push(a);
    draw(); relist();
    await persist();
  };
  m.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  AL.onclick = async e => {
    const n = e.target.dataset && e.target.dataset.del;
    if (n == null || n === '') return;
    e.preventDefault();
    i.ann.splice(+n, 1);
    draw(); relist();
    await persist();
  };
  const cal = m.querySelector('#acal');
  if (cal) cal.onclick = async () => {
    const ln = [...i.ann].reverse().find(a => a.k === 'line');
    if (!ln) return toast('ارسم مسطرة فوق جسم معروف الطول أولاً');
    const v = await dlg('الطول الحقيقي للخط الأخير بالمليمتر:', '');
    const mm = parseFloat(v);
    if (!(mm > 0)) return;
    i.cal = mm / npx(ln);
    draw(); relist();
    await persist();
  };
  const an = m.querySelector('#anote');
  if (an) an.onclick = () => {
    const boxes = i.ann.filter(a => a.k !== 'line');
    if (!boxes.length) return toast('لا توجد تعليقات لإدراجها');
    const cnt = {};
    boxes.forEach(a => cnt[a.l] = (cnt[a.l] || 0) + 1);
    const txt = `[أشعة ${i.type} ${i.date}: ` + Object.entries(cnt).map(([l, n]) => l + (n > 1 ? ' ×' + n : '')).join('، ') + ']';
    const cur = (S.sc[student.id] && S.sc[student.id].note) ? S.sc[student.id].note + ' ' : '';
    setNote(student.id, (cur + txt).trim());
    toast('أُدرج الملخص في ملاحظات الطالب');
    an.style.display = 'none';
  };

  const onKey = e => { if (e.key === 'Escape') close(); };
  function close() {
    window.removeEventListener('resize', fit);
    document.removeEventListener('keydown', onKey);
    m.remove();
  }
  m.querySelector('#vx').onclick = close;
  m.querySelector('#vprev').onclick = () => { close(); if (pos > 0) viewImg(mine[pos - 1].id); };
  m.querySelector('#vnext').onclick = () => { close(); if (pos < mine.length - 1) viewImg(mine[pos + 1].id); };
  window.addEventListener('resize', fit);
  document.addEventListener('keydown', onKey);
  im.onload = fit;
  if (im.complete) fit();
  setTool('view');
  relist();
}

/* ===== التشفير والنسخ الاحتياطي (AES-GCM) ===== */
const enc=new TextEncoder(),b64=u=>{let s='';new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function bak(){const pw=await dlg('كلمة سر لتشفير النسخة (اتركها فارغة لنسخة بدون تشفير):','');if(pw===null)return;let out=JSON.stringify(S);if(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),enc.encode(out));out=JSON.stringify({enc:1,s:b64(salt),i:b64(iv),c:b64(ct)})}dl(out,'backup-'+date+'.json');log('نسخة احتياطية')}
async function readB(f){let d=JSON.parse(await f.text());if(d.enc){const pw=await dlg('كلمة سر الملف:','');if(!pw)throw 0;d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(d.i)},await key(pw,ub(d.s)),ub(d.c))))}return d}

Object.entries(d.sc||{}).forEach(([id,c])=>{const t=map[id];if(!t)return;const L=S.sc[t]=S.sc[t]||{};['prac','exam','act','note'].forEach(k=>f(L,c[k],k));Object.entries(c.w||{}).forEach(([w,v])=>{L.w=L.w||{};f(L.w,v,w)})});

log(`دمج: ${ns} طالب جديد، ${nv} قيمة، ${cf} تعارض`);await commit();toast(`تم الدمج: +${ns} طالب، +${nv} قيمة، ${cf} تعارض (بقيت القيمة المحلية)`)}catch(e){toast('تعذر الدمج أو كلمة السر خاطئة')}i.value=''}

function bell(a){if(a.length<2)return'<small>يلزم نتائج طالبين على الأقل</small>';const n=a.length,m=a.reduce((x,y)=>x+y)/n,sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n)||1,B=Array(10).fill(0),P=[];a.forEach(v=>B[Math.min(9,Math.max(0,v/10|0))]++);const mx=Math.max(...B);for(let x=0;x<=100;x+=2)P.push((x*5.6+14)+','+(110-Math.exp(-((x-m)**2)/(2*sd*sd))*95));
